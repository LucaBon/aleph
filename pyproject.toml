[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aleph-kb"
version = "0.1.0"
description = "Stateless-view knowledge base for LLMs: atomic claims with source spans, verified on every read."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aleph contributors" }]
keywords = ["llm", "knowledge-base", "rag", "claims", "wiki"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
# P2.3: optional embedding retriever (EmbeddingRetriever in retrieval.py).
# Install with `pip install aleph-kb[embeddings]`.
embeddings = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
# P2.1: YAML fixtures for MockLLM. JSON fixtures work without any extra
# dependency; install YAML support with `pip install aleph-kb[yaml]`.
yaml = [
    "pyyaml>=6.0",
]
# Test suite: property-based invariant tests (tests/test_invariants.py).
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[project.scripts]
aleph = "aleph.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/aleph"
Issues = "https://github.com/your-org/aleph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph"]

[tool.pytest.ini_options]
# `pytest` alone runs the property suite plus both e2e scripts and the
# canary benchmark (via tests/test_scripts.py).
testpaths = ["tests"]
