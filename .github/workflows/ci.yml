name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Property suite under the thorough profile (1000 examples x 60 steps),
      # both e2e scripts, and the canary leakage benchmark.
      - run: pytest -v
        env:
          HYPOTHESIS_PROFILE: thorough
